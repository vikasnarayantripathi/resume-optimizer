<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Privacy Policy — ATSCheckPro</title>
<meta name="description" content="ATSCheckPro Privacy Policy — your resume data is never stored. Processed in real-time and automatically deleted within 48 hours."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#16a34a;--green-dark:#14532d;--green-faint:#dcfce7;--dark:#1c1917;--mid:#78716c;--light:#f5f2ee;--white:#fff;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',sans-serif}
body{font-family:var(--sans);background:var(--light);color:var(--dark);line-height:1.7}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;height:60px;background:rgba(245,242,238,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(28,25,23,0.08)}
.nav-logo{font-family:var(--serif);font-size:1.1rem;font-weight:700;color:var(--dark);text-decoration:none}
.nav-logo span{color:var(--green)}
.nav-back{font-size:0.82rem;font-weight:600;color:var(--mid);text-decoration:none;transition:color 0.2s}
.nav-back:hover{color:var(--green)}
.hero-strip{background:var(--dark);padding:52px 5vw 44px;text-align:center}
.hero-strip .tag{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--green);margin-bottom:0.6rem}
.hero-strip h1{font-family:var(--serif);font-size:clamp(1.8rem,3vw,2.6rem);font-weight:900;color:#f5f2ee;letter-spacing:-0.03em;margin-bottom:0.5rem}
.hero-strip p{font-size:0.85rem;color:rgba(255,255,255,0.35)}
.content{max-width:760px;margin:0 auto;padding:56px 5vw 80px}
.section{margin-bottom:2.75rem}
.section h2{font-family:var(--serif);font-size:1.25rem;font-weight:700;color:var(--dark);letter-spacing:-0.02em;margin-bottom:0.875rem;padding-bottom:0.5rem;border-bottom:2px solid var(--green-faint)}
.section h3{font-size:0.92rem;font-weight:700;color:var(--dark);margin:1.25rem 0 0.4rem}
.section p{font-size:0.9rem;color:var(--mid);margin-bottom:0.75rem;font-weight:300}
.section ul{margin:0.5rem 0 0.75rem 1.25rem}
.section ul li{font-size:0.9rem;color:var(--mid);margin-bottom:0.4rem;font-weight:300}
.highlight-box{background:var(--green-faint);border-left:3px solid var(--green);border-radius:0 8px 8px 0;padding:1rem 1.25rem;margin-bottom:1.5rem}
.highlight-box p{color:var(--green-dark)!important;font-weight:500!important;margin:0;font-size:0.92rem}
.security-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:1.5rem 0}
.security-card{background:var(--white);border:1px solid rgba(28,25,23,0.08);border-radius:12px;padding:1.25rem;text-align:center}
.security-card .icon{font-size:1.6rem;margin-bottom:0.5rem}
.security-card h4{font-size:0.78rem;font-weight:700;color:var(--dark);margin-bottom:0.3rem}
.security-card p{font-size:0.74rem;color:var(--mid);margin:0;font-weight:300}
.timeline{border-left:2px solid var(--green-faint);padding-left:1.5rem;margin:1rem 0}
.timeline-item{position:relative;margin-bottom:1.25rem}
.timeline-item::before{content:'';position:absolute;left:-1.65rem;top:0.35rem;width:10px;height:10px;border-radius:50%;background:var(--green)}
.timeline-item h4{font-size:0.85rem;font-weight:700;color:var(--dark);margin-bottom:0.2rem}
.timeline-item p{font-size:0.82rem;color:var(--mid);margin:0;font-weight:300}
.contact-box{background:var(--white);border:1px solid rgba(28,25,23,0.08);border-radius:12px;padding:1.5rem;text-align:center;margin-top:2rem}
.contact-box p{color:var(--mid);font-size:0.88rem;margin-bottom:0.4rem}
.contact-box a{color:var(--green);font-weight:600;text-decoration:none}
footer{background:var(--dark);padding:28px 5vw;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
footer span{font-size:0.78rem;color:rgba(255,255,255,0.2)}
.footer-links{display:flex;gap:1.5rem;flex-wrap:wrap}
.footer-links a{font-size:0.78rem;color:rgba(255,255,255,0.3);text-decoration:none;transition:color 0.2s}
.footer-links a:hover{color:rgba(255,255,255,0.7)}
@media(max-width:640px){.security-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">ATS<span>Check</span>Pro</a>
  <a href="/" class="nav-back">← Back to Home</a>
</nav>
<div class="hero-strip">
  <div class="tag">Legal</div>
  <h1>Privacy Policy</h1>
  <p>Last updated: February 28, 2026 · Effective immediately</p>
</div>
  <div class="highlight-box"><p>Your resume is never stored. Processed in real-time and deleted within 48 hours.</p></div>
  </body></html>
