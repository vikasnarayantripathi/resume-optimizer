<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ATSCheckPro</title>

<style>

body{
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
background:#eef2f7;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:white;
padding:26px;
border-radius:12px;
margin-bottom:22px;
box-shadow:0 8px 22px rgba(0,0,0,.06);
}

textarea,input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #d4d8e2;
font-size:14px;
}

button{
padding:15px;
border-radius:10px;
border:none;
font-weight:700;
background:linear-gradient(135deg,#667eea,#5a63d8);
color:white;
width:100%;
font-size:15px;
cursor:pointer;
}
button:hover{opacity:.95}

.score{
font-size:32px;
font-weight:800;
text-align:center;
color:#2f3a56;
}

.resume{
font-family: "Times New Roman", Georgia, serif;
font-size:15px;
line-height:1.75;
color:#222;
white-space:pre-wrap;
}

.name{
font-size:26px;
font-weight:800;
text-align:center;
letter-spacing:.5px;
margin-bottom:6px;
}

.contact{
text-align:center;
color:#666;
font-size:14px;
margin-bottom:16px;
}

.section{
margin-top:18px;
}

.section-title{
font-weight:700;
font-size:15px;
color:#333;
margin-bottom:6px;
}

.rule{
border-top:1px solid #dcdfe7;
margin:8px 0 12px;
}

.lock{
background:#fafafa;
padding:20px;
border-radius:10px;
text-align:center;
color:#666;
}

</style>
</head>

<body>

<div class="container">

<h2>⚡ ATSCheckPro</h2>

<div class="card">
<h3>Job Description</h3>
<textarea id="job" rows="7"></textarea>
</div>

<div class="card">
<h3>Resume</h3>
<textarea id="resume" rows="9"></textarea>
</div>

<div class="card">
<h3>License Key (optional)</h3>
<input id="key">
</div>

<button onclick="run()">Analyze Resume</button>

<div id="results" style="display:none">

<div class="card">
<div id="score" class="score"></div>
</div>

<div class="card">
<h3>Recruiter Impression</h3>
<div id="imp"></div>
</div>

<div class="card">
<h3>Missing Keywords</h3>
<div id="kw"></div>
</div>

<div class="card">
<h3>Optimized Resume</h3>
<div id="resumeOut" class="resume"></div>
</div>

<div class="card">
<h3>Cover Letter</h3>
<div id="coverOut" class="resume"></div>
</div>

<div class="card">
<h3>Recruiter Notes</h3>
<div id="notesOut"></div>
</div>

</div>

</div>

<script>

function renderResume(text){

if(!text) return "";

const lines=text.split("\n").filter(l=>l.trim()!="");

if(lines.length<2) return text;

let name=lines[0];
let contact=lines[1];
let body=lines.slice(2).join("\n");

return `
<div class="name">${name}</div>
<div class="contact">${contact}</div>
<div class="rule"></div>
<div>${body.replace(/--------------------------------/g,'<div class="rule"></div>')}</div>
`;

}

async function run(){

const job=document.getElementById("job").value.trim();
const resume=document.getElementById("resume").value.trim();
const key=document.getElementById("key").value.trim();

if(!job||!resume){
alert("Paste job + resume first");
return;
}

const res=await fetch("/api/optimize",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
jobDescription:job,
resumeText:resume,
licenseKey:key||""
})
});

const data=await res.json();

document.getElementById("results").style.display="block";

document.getElementById("score").innerText=
"ATS Match Score: "+data.scoreBefore+"/100";

document.getElementById("imp").innerHTML=
(data.quickImpression||[]).map(x=>"• "+x).join("<br>");

document.getElementById("kw").innerHTML=
(data.keywordsMissingTop||[]).map(x=>"• "+x).join("<br>");

if(data.isPro){

document.getElementById("resumeOut").innerHTML=
renderResume(data.optimizedText);

document.getElementById("coverOut").innerText=data.coverLetter||"";

document.getElementById("notesOut").innerHTML=
(data.recruiterNotes||[]).map(n=>"• "+n).join("<br>");

}else{

document.getElementById("resumeOut").innerHTML=
"<div class='lock'>🔒 Unlock PRO to view professional resume</div>";

document.getElementById("coverOut").innerHTML=
"<div class='lock'>🔒 Unlock PRO to view cover letter</div>";

document.getElementById("notesOut").innerHTML=
"<div class='lock'>🔒 Unlock PRO</div>";

}

}

</script>

</body>
</html>
