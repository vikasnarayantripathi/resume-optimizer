<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ATSCheckPro</title>

<style>
body{font-family:Arial;background:#f4f6fb;margin:0}
.container{max-width:900px;margin:auto;padding:30px}
.card{background:white;padding:22px;border-radius:10px;margin-bottom:20px;box-shadow:0 3px 12px rgba(0,0,0,.05)}
textarea,input{width:100%;padding:10px;border-radius:6px;border:1px solid #ccc}
button{padding:14px;border-radius:8px;border:none;font-weight:bold;background:#667eea;color:white;width:100%}
button:hover{background:#5563d6}
.score{font-size:30px;font-weight:bold}
.resumeBox{
white-space:pre-wrap;
font-family:Georgia,serif;
line-height:1.7;
font-size:15px;
}
.divider{
border-top:1px dashed #ccc;
margin:18px 0;
}
.locked{background:#fafafa;padding:18px;text-align:center;color:#666;border-radius:8px}
</style>

</head>

<body>

<div class="container">

<h2>⚡ ATSCheckPro</h2>

<div class="card">
<h3>Job Description</h3>
<textarea id="job" rows="7"></textarea>
</div>

<div class="card">
<h3>Resume</h3>
<textarea id="resume" rows="9"></textarea>
</div>

<div class="card">
<h3>License Key (optional)</h3>
<input id="key">
</div>

<button onclick="run()">Analyze</button>

<div id="results" style="display:none">

<div class="card">
<div class="score" id="score"></div>
</div>

<div class="card">
<h3>Recruiter Impression</h3>
<div id="imp"></div>
</div>

<div class="card">
<h3>Missing Keywords</h3>
<div id="kw"></div>
</div>

<div class="card">
<h3>Optimized Resume</h3>
<div class="divider"></div>
<div id="resumeOut" class="resumeBox"></div>
</div>

<div class="card">
<h3>Cover Letter</h3>
<div class="divider"></div>
<div id="coverOut" class="resumeBox"></div>
</div>

<div class="card">
<h3>Recruiter Notes</h3>
<div id="notesOut"></div>
</div>

</div>

</div>

<script>

async function run(){

const job=document.getElementById("job").value.trim();
const resume=document.getElementById("resume").value.trim();
const key=document.getElementById("key").value.trim();

if(!job||!resume){alert("Paste job + resume");return;}

const res=await fetch("/api/optimize",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
jobDescription:job,
resumeText:resume,
licenseKey:key||""
})
});

const data=await res.json();

document.getElementById("results").style.display="block";
document.getElementById("score").innerText="ATS Score: "+data.scoreBefore+"/100";

document.getElementById("imp").innerHTML=
(data.quickImpression||[]).map(x=>"• "+x).join("<br>");

document.getElementById("kw").innerHTML=
(data.keywordsMissingTop||[]).map(x=>"• "+x).join("<br>");

if(data.isPro){

document.getElementById("resumeOut").innerText=data.optimizedText||"";
document.getElementById("coverOut").innerText=data.coverLetter||"";
document.getElementById("notesOut").innerHTML=
(data.recruiterNotes||[]).map(n=>"• "+n).join("<br>");

}else{

document.getElementById("resumeOut").innerHTML="<div class='locked'>🔒 Unlock PRO to view formatted resume</div>";
document.getElementById("coverOut").innerHTML="<div class='locked'>🔒 Unlock PRO to view cover letter</div>";
document.getElementById("notesOut").innerHTML="<div class='locked'>🔒 Unlock PRO</div>";

}

}

</script>

</body>
</html>
