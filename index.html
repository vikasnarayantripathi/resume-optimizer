<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ATSCheckPro</title>

<style>
body{font-family:system-ui;background:#eef2f7;margin:0}

.wrapper{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;padding:20px;height:100vh;box-sizing:border-box}

.panel{background:white;border-radius:14px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.06);overflow:auto}

textarea,input{width:100%;padding:10px;border-radius:8px;border:1px solid #d4d8e2;margin-top:6px}

button{padding:12px;border-radius:10px;border:none;font-weight:700;background:linear-gradient(135deg,#667eea,#5a63d8);color:white;width:100%;margin-top:12px;cursor:pointer}

/* score */
.scoreWrap{display:flex;align-items:center;gap:18px;margin-bottom:10px}
.circle{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:white;background:conic-gradient(#2ecc71 0deg,#e5e7ef 0deg)}
.scoreText{font-size:30px;font-weight:900;background:linear-gradient(90deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* tabs */
.tabs{display:flex;gap:10px;margin:14px 0}
.tab{padding:8px 14px;border-radius:10px;background:#eef1fa;cursor:pointer;font-weight:700}
.tab.active{background:linear-gradient(135deg,#667eea,#5a63d8);color:white;box-shadow:0 6px 14px rgba(102,126,234,.35)}

/* resume header */
.resumeHeader{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.photo{width:85px;height:85px;border-radius:50%;object-fit:cover;border:2px solid #ddd;flex-shrink:0}
.name{font-size:22px;font-weight:900}
.contact{color:#666;font-size:14px}
.rule{border-top:1px solid #e2e5ee;margin:10px 0}
.resume{font-family:Georgia,serif;white-space:pre-wrap;line-height:1.7}

/* report */
.reportBox{background:#f7f8fc;padding:14px;border-radius:10px;margin-bottom:10px}
.bar{height:12px;background:#e3e7f1;border-radius:20px;overflow:hidden;margin-top:6px}
.barFill{height:100%;background:linear-gradient(90deg,#ff5a5a,#ffcc00,#2ecc71)}

/* chips */
.chip{display:inline-block;padding:5px 10px;margin:3px;border-radius:14px;font-size:12px;font-weight:700}
.found{background:#d4f6df;color:#0b7a39}
.missing{background:#ffe0e0;color:#b30000}

</style>
</head>

<body>

<div class="wrapper">

<div class="panel">

<h3>Job Description</h3>
<textarea id="job" rows="6"></textarea>

<h3>Resume</h3>
<textarea id="resume" rows="7"></textarea>

<h4>Candidate Photo</h4>
<input type="file" id="photoInput" accept="image/*">

<h4>License Key</h4>
<input id="key">

<button onclick="run()">Analyze Resume</button>

</div>

<div class="panel">

<div id="results" style="display:none">

<div class="scoreWrap">
<div id="circle" class="circle">0</div>
<div>
<div id="score" class="scoreText"></div>
<div id="scoreLabel"></div>
</div>
</div>

<div id="chips"></div>

<div class="tabs">
<div class="tab active" onclick="showTab('resumeTab',this)">Resume</div>
<div class="tab" onclick="showTab('coverTab',this)">Cover Letter</div>
<div class="tab" onclick="showTab('reportTab',this)">Report</div>
</div>

<div id="resumeTab"></div>
<div id="coverTab" style="display:none"></div>
<div id="reportTab" style="display:none"></div>

</div>

</div>
</div>

<script>

let photoBase64="";
let lastData=null;

/* photo */

photoInput.onchange=e=>{
const f=e.target.files[0];
if(!f)return;
const r=new FileReader();
r.onload=()=>photoBase64=r.result;
r.readAsDataURL(f);
};

/* tabs */

function showTab(id,el){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
el.classList.add("active");
["resumeTab","coverTab","reportTab"].forEach(x=>document.getElementById(x).style.display="none");
document.getElementById(id).style.display="block";
}

/* render resume */

function renderResume(text){

const lines=text.split("\n").filter(l=>l.trim());
const name=lines[0]||"";
const contact=lines[1]||"";
const body=lines.slice(2).join("\n");

return `
<div class="resumeHeader">
${photoBase64?`<img src="${photoBase64}" class="photo">`:""}
<div>
<div class="name">${name}</div>
<div class="contact">${contact}</div>
</div>
</div>
<div class="rule"></div>
<div class="resume">${body.replace(/--------------------------------/g,'<div class="rule"></div>')}</div>
<button onclick="downloadResume()">Download Resume</button>
`;
}

/* analyze */

async function run(){

const response=await fetch("/api/optimize",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
jobDescription:job.value.trim(),
resumeText:resume.value.trim(),
licenseKey:key.value.trim()
})
});

const data=await response.json();
lastData=data;

results.style.display="block";

/* score */

const s=data.scoreBefore||0;
score.innerText=s+"/100";
circle.innerText=s;
circle.style.background=`conic-gradient(#2ecc71 ${s*3.6}deg,#e5e7ef 0deg)`;

/* chips */

chips.innerHTML="";
(data.keywordsFound||[]).forEach(k=>chips.innerHTML+=`<span class="chip found">${k}</span>`);
(data.keywordsMissingTop||[]).forEach(k=>chips.innerHTML+=`<span class="chip missing">${k}</span>`);

/* content */

if(data.isPro){

resumeTab.innerHTML=renderResume(data.optimizedText);

coverTab.innerHTML=`
<div class="resume">${data.coverLetter||""}</div>
<button onclick="downloadCover()">Download Cover</button>
`;

reportTab.innerHTML=`
<div class="reportBox">
<b>ATS Score</b>
<div class="bar"><div class="barFill" style="width:${s}%"></div></div>
</div>

<div class="reportBox">
<b>Recruiter Impression</b><br>
${(data.quickImpression||[]).map(x=>"• "+x).join("<br>")}
</div>

<div class="reportBox">
<b>Missing Keywords</b><br>
${(data.keywordsMissingTop||[]).map(x=>`<span class="chip missing">${x}</span>`).join("")}
</div>

<div class="reportBox">
<b>Recruiter Notes</b><br>
${(data.recruiterNotes||[]).map(x=>"• "+x).join("<br>")}
</div>

<button onclick="downloadReport()">Download Report</button>
`;

}else{
resumeTab.innerHTML="🔒 Unlock PRO";
}

}

/* filename */

function candidateName(){
let n=(lastData?.optimizedText||"").split("\n")[0]||"resume";
return n.replace(/[^a-z0-9]/gi,"-");
}

/* download */

async function download(body,name){

if(!lastData){alert("Run analysis first");return;}

const r=await fetch("/api/download",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(body)
});

if(!r.ok){alert("Download failed");return;}

const blob=await r.blob();
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=name+".pdf";
a.click();
URL.revokeObjectURL(url);
}

function downloadResume(){
download({
type:"resume",
optimizedText:lastData.optimizedText,
photo:photoBase64,
licenseKey:key.value.trim()
},candidateName()+"-Resume");
}

function downloadCover(){
download({
type:"cover",
coverLetter:lastData.coverLetter,
licenseKey:key.value.trim()
},candidateName()+"-Cover");
}

function downloadReport(){
download({
type:"report",
report:{
score:lastData.scoreBefore,
impression:lastData.quickImpression,
keywords:lastData.keywordsMissingTop,
notes:lastData.recruiterNotes
},
licenseKey:key.value.trim()
},candidateName()+"-Report");
}

</script>

</body>
</html>
