<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATSCheckPro — Resume Optimizer</title>

<style>
body { font-family: Arial, sans-serif; background:#f0f4f8; margin:0; }
.container { max-width:900px; margin:auto; padding:30px; }
.card { background:white; padding:20px; border-radius:10px; margin-bottom:20px; }
textarea,input { width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; }
button { padding:14px 18px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
.btn { background:#667eea; color:white; width:100%; margin-top:15px; }
.btn:hover { background:#5a67d8; }
.locked { background:#f9fafb; padding:20px; text-align:center; color:#666; border-radius:8px; }
.score { font-size:28px; font-weight:bold; }
.chip { display:inline-block; padding:5px 10px; margin:4px; border-radius:15px; font-size:13px; }
.missing { background:#fed7d7; }
</style>
</head>

<body>

<div class="container">

<h2>⚡ ATSCheckPro — Free Resume Analysis</h2>
<p>Paste job description + resume → get ATS feedback instantly.</p>

<div class="card">
<h3>Job Description</h3>
<textarea id="job" rows="8"></textarea>
</div>

<div class="card">
<h3>Your Resume</h3>
<textarea id="resume" rows="10"></textarea>
</div>

<div class="card">
<h3>License Key (optional for PRO)</h3>
<input id="key">
</div>

<button class="btn" onclick="run()">⚡ Analyze Resume</button>

<div id="results" style="display:none">

<div class="card">
<h3>ATS Score</h3>
<div class="score" id="score"></div>
</div>

<div class="card">
<h3>Recruiter Impression</h3>
<div id="impression"></div>
</div>

<div class="card">
<h3>Missing Keywords</h3>
<div id="keywords"></div>
</div>

<div class="card">
<h3>Optimized Resume</h3>
<div id="optimized"></div>
</div>

<div class="card">
<h3>Cover Letter</h3>
<div id="cover"></div>
</div>

<div class="card">
<h3>Recruiter Notes</h3>
<div id="notes"></div>
</div>

</div>

</div>

<script>

async function run(){

const job = document.getElementById("job").value.trim();
const resume = document.getElementById("resume").value.trim();
const key = document.getElementById("key").value.trim();

if(!job || !resume){
alert("Please paste job + resume");
return;
}

try{

const res = await fetch("/api/optimize",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
jobDescription:job,
resumeText:resume,
licenseKey:key || ""
})
});

if(!res.ok){
const err = await res.json().catch(()=>({}));
throw new Error(err.error || "Server error");
}

const data = await res.json();

document.getElementById("results").style.display="block";

document.getElementById("score").innerText=data.scoreBefore+"/100";

document.getElementById("impression").innerHTML=
(data.quickImpression||[]).map(x=>"• "+x).join("<br>");

document.getElementById("keywords").innerHTML=
(data.keywordsMissingTop||[]).map(x=>`<span class="chip missing">${x}</span>`).join("");

if(data.isPro && data.optimizedText){

document.getElementById("optimized").innerText=data.optimizedText;
document.getElementById("cover").innerText=data.coverLetter || "";
document.getElementById("notes").innerHTML=
(data.recruiterNotes||[]).map(n=>"• "+n).join("<br>");

}else{

document.getElementById("optimized").innerHTML=
`<div class="locked">🔒 Optimized resume ready.<br>Enter license key and run again to unlock.</div>`;

document.getElementById("cover").innerHTML=
`<div class="locked">🔒 Cover letter available in PRO</div>`;

document.getElementById("notes").innerHTML=
`<div class="locked">🔒 Recruiter insights available in PRO</div>`;

}

}catch(e){

console.error(e);
alert("Error: "+e.message);

}

}

</script>

</body>
</html>
