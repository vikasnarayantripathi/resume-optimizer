<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ATSCheckPro</title>

<style>

body{font-family:system-ui;background:#eef2f7;margin:0}

/* layout */
.wrapper{
display:grid;
grid-template-columns: 1fr 1.2fr;
gap:20px;
padding:20px;
height:100vh;
box-sizing:border-box;
}

.panel{
background:white;
border-radius:14px;
padding:20px;
box-shadow:0 8px 24px rgba(0,0,0,.06);
overflow:auto;
}

/* inputs */
textarea,input{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #d4d8e2;
margin-top:6px;
}

button{
padding:12px;
border-radius:10px;
border:none;
font-weight:700;
background:linear-gradient(135deg,#667eea,#5a63d8);
color:white;
width:100%;
margin-top:12px;
cursor:pointer;
}

/* resume header */

.resumeHeader{
display:flex;
align-items:center;
gap:15px;
margin-bottom:10px;
}

.photo{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
border:2px solid #ddd;
flex-shrink:0;
}

.name{font-size:22px;font-weight:800}
.contact{color:#666;font-size:14px}

.rule{border-top:1px solid #e2e5ee;margin:10px 0}

.resume{
font-family:Georgia,serif;
white-space:pre-wrap;
line-height:1.7;
}

/* tabs */

.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{
padding:6px 12px;
border-radius:8px;
background:#eef1fa;
cursor:pointer;
font-weight:600;
}
.tab.active{background:#667eea;color:white}

/* meter */
.meter{height:14px;background:#e3e7f1;border-radius:20px;overflow:hidden;margin-top:6px}
.meter-fill{height:100%;background:linear-gradient(90deg,#ff5a5a,#ffcc00,#2ecc71);width:0%}

/* chips */
.chip{display:inline-block;padding:4px 10px;margin:3px;border-radius:14px;font-size:12px;font-weight:600}
.found{background:#d4f6df;color:#0b7a39}
.missing{background:#ffe0e0;color:#b30000}

</style>
</head>

<body>

<div class="wrapper">

<!-- LEFT INPUT -->
<div class="panel">

<h3>Job Description</h3>
<textarea id="job" rows="6"></textarea>

<h3>Resume</h3>
<textarea id="resume" rows="7"></textarea>

<h4>Candidate Photo</h4>
<input type="file" id="photoInput" accept="image/*">

<h4>License Key</h4>
<input id="key">

<button onclick="run()">Analyze Resume</button>

</div>

<!-- RIGHT RESULTS -->
<div class="panel">

<div id="results" style="display:none">

<h3 id="score"></h3>
<div class="meter"><div id="meterFill" class="meter-fill"></div></div>

<div id="chips"></div>

<div class="tabs">
<div class="tab active" onclick="showTab('resumeTab',this)">Resume</div>
<div class="tab" onclick="showTab('coverTab',this)">Cover Letter</div>
<div class="tab" onclick="showTab('reportTab',this)">Report</div>
</div>

<div id="resumeTab" class="tabContent"></div>
<div id="coverTab" class="tabContent" style="display:none"></div>
<div id="reportTab" class="tabContent" style="display:none"></div>

</div>

</div>

</div>

<script>

let photoBase64="";

photoInput.addEventListener("change",e=>{
const f=e.target.files[0];
if(!f)return;
const r=new FileReader();
r.onload=()=>photoBase64=r.result;
r.readAsDataURL(f);
});

/* tabs */

function showTab(id,el){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
el.classList.add("active");

document.querySelectorAll(".tabContent").forEach(c=>c.style.display="none");
document.getElementById(id).style.display="block";
}

/* render resume */

function renderResume(text){

const lines=text.split("\n").filter(l=>l.trim());

const name=lines[0]||"";
const contact=lines[1]||"";
const body=lines.slice(2).join("\n");

return `
<div class="resumeHeader">
${photoBase64?`<img src="${photoBase64}" class="photo">`:""}
<div>
<div class="name">${name}</div>
<div class="contact">${contact}</div>
</div>
</div>

<div class="rule"></div>

<div class="resume">
${body.replace(/--------------------------------/g,'<div class="rule"></div>')}
</div>

<button onclick="downloadResume()">Download Resume</button>
`;
}

/* run */

async function run(){

const jobVal=job.value.trim();
const resumeVal=resume.value.trim();
const keyVal=key.value.trim();

if(!jobVal||!resumeVal)return alert("Paste job + resume");

const res=await fetch("/api/optimize",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
jobDescription:jobVal,
resumeText:resumeVal,
licenseKey:keyVal
})
});

const data=await res.json();
window.lastData=data;

results.style.display="block";

score.innerText="ATS Score: "+data.scoreBefore+"/100";
meterFill.style.width=data.scoreBefore+"%";

chips.innerHTML="";
(data.keywordsFound||[]).forEach(k=>chips.innerHTML+=`<span class="chip found">${k}</span>`);
(data.keywordsMissingTop||[]).forEach(k=>chips.innerHTML+=`<span class="chip missing">${k}</span>`);

if(data.isPro){
resumeTab.innerHTML=renderResume(data.optimizedText);
coverTab.innerHTML=`<div class="resume">${data.coverLetter||""}</div><button onclick="downloadCover()">Download Cover</button>`;
reportTab.innerHTML=`<button onclick="downloadReport()">Download Report</button>`;
}else{
resumeTab.innerHTML="🔒 Unlock PRO";
coverTab.innerHTML="";
reportTab.innerHTML="";
}

}

/* filename */

function candidateName(){
let n=(lastData?.optimizedText||"").split("\n")[0]||"resume";
return n.replace(/[^a-z0-9]/gi,"-").replace(/-+/g,"-");
}

/* downloads */

async function download(body,name){

const r=await fetch("/api/download",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(body)
});

const blob=await r.blob();
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=name+".pdf";
a.click();
URL.revokeObjectURL(url);
}

function downloadResume(){
download({
type:"resume",
optimizedText:lastData.optimizedText,
photo:photoBase64,
licenseKey:key.value.trim()
},candidateName()+"-Resume");
}

function downloadCover(){
download({
type:"cover",
coverLetter:lastData.coverLetter,
licenseKey:key.value.trim()
},candidateName()+"-Cover");
}

function downloadReport(){
download({
type:"report",
report:{
score:lastData.scoreBefore,
impression:lastData.quickImpression,
keywords:lastData.keywordsMissingTop,
notes:lastData.recruiterNotes
},
licenseKey:key.value.trim()
},candidateName()+"-ATSReport");
}

</script>

</body>
</html>
