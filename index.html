<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ATSCheckPro</title>

<style>
body{font-family:system-ui;background:#eef2f7;margin:0}
.container{max-width:900px;margin:auto;padding:30px}
.card{background:white;padding:26px;border-radius:12px;margin-bottom:22px;box-shadow:0 8px 22px rgba(0,0,0,.06)}
textarea,input{width:100%;padding:12px;border-radius:8px;border:1px solid #d4d8e2;font-size:14px}
button{padding:14px;border-radius:10px;border:none;font-weight:700;background:#667eea;color:white;width:100%;margin-top:10px;cursor:pointer}
button:hover{opacity:.95}
.score{font-size:32px;font-weight:800;text-align:center;color:#2f3a56}
.resume{font-family:Georgia,serif;font-size:15px;line-height:1.7;white-space:pre-wrap}
.name{font-size:26px;font-weight:800;text-align:center;margin-bottom:6px}
.contact{text-align:center;color:#666;font-size:14px;margin-bottom:16px}
.rule{border-top:1px solid #dcdfe7;margin:10px 0}
.lock{background:#fafafa;padding:20px;border-radius:10px;text-align:center;color:#666}
</style>
</head>

<body>

<div class="container">

<h2>⚡ ATSCheckPro</h2>

<div class="card">
<h3>Job Description</h3>
<textarea id="job" rows="7"></textarea>
</div>

<div class="card">
<h3>Resume</h3>
<textarea id="resume" rows="9"></textarea>
</div>

<div class="card">
<h3>License Key (optional)</h3>
<input id="key">
</div>

<button onclick="run()">Analyze Resume</button>

<div id="results" style="display:none">

<div class="card">
<div id="score" class="score"></div>
</div>

<div class="card">
<h3>Recruiter Impression</h3>
<div id="imp"></div>
</div>

<div class="card">
<h3>Missing Keywords</h3>
<div id="kw"></div>
</div>

<div class="card">
<h3>Optimized Resume</h3>
<div id="resumeOut" class="resume"></div>
<button onclick="downloadResume()">Download Optimized Resume PDF</button>
</div>

<div class="card">
<h3>Cover Letter</h3>
<div id="coverOut" class="resume"></div>
<button onclick="downloadCover()">Download Cover Letter PDF</button>
</div>

<div class="card">
<h3>Optimization Report</h3>
<button onclick="downloadReport()">Download Optimization Report PDF</button>
</div>

</div>

</div>

<script>

function renderResume(text){

if(!text) return "";

const lines=text.split("\n").filter(l=>l.trim()!="");

if(lines.length<2) return text;

let name=lines[0];
let contact=lines[1];
let body=lines.slice(2).join("\n");

return `
<div class="name">${name}</div>
<div class="contact">${contact}</div>
<div class="rule"></div>
<div>${body.replace(/--------------------------------/g,'<div class="rule"></div>')}</div>
`;
}

async function run(){

const job=document.getElementById("job").value.trim();
const resume=document.getElementById("resume").value.trim();
const key=document.getElementById("key").value.trim();

if(!job||!resume){
alert("Paste job + resume first");
return;
}

const res=await fetch("/api/optimize",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
jobDescription:job,
resumeText:resume,
licenseKey:key||""
})
});

const data=await res.json();
window.lastData=data;

document.getElementById("results").style.display="block";

document.getElementById("score").innerText=
"ATS Match Score: "+data.scoreBefore+"/100";

document.getElementById("imp").innerHTML=
(data.quickImpression||[]).map(x=>"• "+x).join("<br>");

document.getElementById("kw").innerHTML=
(data.keywordsMissingTop||[]).map(x=>"• "+x).join("<br>");

if(data.isPro){

document.getElementById("resumeOut").innerHTML=
renderResume(data.optimizedText);

document.getElementById("coverOut").innerText=data.coverLetter||"";

}else{

document.getElementById("resumeOut").innerHTML=
"<div class='lock'>🔒 Unlock PRO to download resume</div>";

document.getElementById("coverOut").innerHTML=
"<div class='lock'>🔒 Unlock PRO to download cover letter</div>";

}

}

async function download(type,body){

const res=await fetch("/api/download",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(body)
});

if(!res.ok){
alert("Download failed — ensure PRO key used");
return;
}

const blob=await res.blob();
const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download=type+".pdf";
a.click();

URL.revokeObjectURL(url);
}

function downloadResume(){

if(!window.lastData?.optimizedText){
alert("Run PRO analysis first");
return;
}

download("resume",{
type:"resume",
optimizedText:window.lastData.optimizedText,
licenseKey:document.getElementById("key").value.trim()
});
}

function downloadCover(){

if(!window.lastData?.coverLetter){
alert("Run PRO analysis first");
return;
}

download("cover",{
type:"cover",
coverLetter:window.lastData.coverLetter,
licenseKey:document.getElementById("key").value.trim()
});
}

function downloadReport(){

if(!window.lastData){
alert("Run analysis first");
return;
}

download("report",{
type:"report",
report:{
score:window.lastData.scoreBefore,
impression:window.lastData.quickImpression,
keywords:window.lastData.keywordsMissingTop,
notes:window.lastData.recruiterNotes
},
licenseKey:document.getElementById("key").value.trim()
});
}

</script>

</body>
</html>
