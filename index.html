<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ATSCheckPro</title>

<style>
body{font-family:system-ui;background:#eef2f7;margin:0}
.wrapper{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;padding:20px;height:100vh;box-sizing:border-box}
.panel{background:white;border-radius:14px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.06);overflow:auto}
textarea,input{width:100%;padding:10px;border-radius:8px;border:1px solid #d4d8e2;margin-top:6px}
button{padding:12px;border-radius:10px;border:none;font-weight:700;background:linear-gradient(135deg,#667eea,#5a63d8);color:white;width:100%;margin-top:12px;cursor:pointer}
.scoreText{font-size:32px;font-weight:900}
.chip{display:inline-block;padding:5px 10px;margin:3px;border-radius:14px;font-size:12px;font-weight:700}
.found{background:#d4f6df;color:#0b7a39}
.missing{background:#ffe0e0;color:#b30000}
.resume{white-space:pre-wrap;font-family:Georgia,serif;line-height:1.6}
.tabs{display:flex;gap:10px;margin-top:14px}
.tab{padding:8px 14px;border-radius:10px;background:#eef1fa;cursor:pointer;font-weight:700}
.tab.active{background:#667eea;color:white}
</style>
</head>

<body>

<div class="wrapper">

<div class="panel">
<h3>Job Description</h3>
<textarea id="job" rows="6"></textarea>

<h3>Resume</h3>
<textarea id="resume" rows="7"></textarea>

<h4>Photo</h4>
<input type="file" id="photo">

<h4>License Key</h4>
<input id="license">

<button id="analyzeBtn">Analyze Resume</button>
</div>

<div class="panel">

<div id="results" style="display:none">

<div id="score" class="scoreText"></div>

<div id="chips"></div>

<div class="tabs">
<div class="tab active" data-tab="resume">Resume</div>
<div class="tab" data-tab="cover">Cover Letter</div>
<div class="tab" data-tab="report">Report</div>
</div>

<div id="content" class="resume"></div>

<button id="downloadResume">Download Resume</button>
<button id="downloadCover">Download Cover</button>
<button id="downloadReport">Download Report</button>

</div>

</div>

</div>

<script>

const state={
pro:false,
score:0,
resume:"",
cover:"",
notes:[],
active:"resume",
filename:"ATSCheckPro"
};

let photoBase64="";

/* PHOTO */
photo.onchange=e=>{
const f=e.target.files[0];
if(!f)return;
const r=new FileReader();
r.onload=()=>photoBase64=r.result;
r.readAsDataURL(f);
};

/* TAB SWITCH */
document.querySelectorAll(".tab").forEach(tab=>{
tab.onclick=()=>{
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
tab.classList.add("active");
state.active=tab.dataset.tab;
renderContent();
};
});

function renderContent(){
if(state.active==="resume") content.textContent=state.resume;
if(state.active==="cover") content.textContent=state.cover;
if(state.active==="report") content.innerHTML=state.notes.map(x=>"• "+x).join("<br>");
}

/* VALIDATE LICENSE */
async function validateKey(key){
if(!key) return false;

const r=await fetch("/api/validate-key",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({key})
});

const d=await r.json();
return d.valid===true;
}

/* ANALYZE */

analyzeBtn.onclick=async()=>{

const jd=job.value.trim();
const resText=resume.value.trim();
const key=license.value.trim();

if(!jd||!resText){
alert("Provide JD and Resume");
return;
}

state.pro=await validateKey(key);

const r=await fetch("/api/optimize",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
jobDescription:jd,
resumeText:resText,
isPro:state.pro
})
});

if(!r.ok){alert("Server error");return;}

const data=await r.json();

results.style.display="block";

state.score=data.scoreBefore||0;
state.resume=data.optimizedText||"";
state.cover=data.coverLetter||"";
state.notes=data.recruiterNotes||[];
state.filename="ATSCheckPro-"+Date.now();

score.textContent="ATS Score: "+state.score+"/100";

chips.innerHTML=
"<b>Matched:</b>"+
(data.keywordsFound||[]).map(k=>`<span class="chip found">${k}</span>`).join("")+
"<br><b>Missing:</b>"+
(data.keywordsMissingTop||[]).map(k=>`<span class="chip missing">${k}</span>`).join("");

if(state.pro){
renderContent();
}else{
content.textContent="🔒 Unlock PRO to view optimized resume & downloads.";
}

};

/* DOWNLOAD */

async function download(type,payload){

if(!state.pro){
alert("PRO required");
return;
}

const r=await fetch("/api/download",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({...payload,type})
});

if(!r.ok){alert("Download failed");return;}

const blob=await r.blob();
const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download=state.filename+"-"+type+".pdf";
a.click();
URL.revokeObjectURL(url);
}

downloadResume.onclick=()=>download("resume",{optimizedText:state.resume,photo:photoBase64});
downloadCover.onclick=()=>download("cover",{coverLetter:state.cover});
downloadReport.onclick=()=>download("report",{report:{score:state.score,notes:state.notes}});

</script>

</body>
</html>
