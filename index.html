<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ATSCheckPro</title>

<style>

body{
font-family:system-ui,-apple-system,Segoe UI,Roboto;
background:#eef2f7;
margin:0;
}

.container{max-width:900px;margin:auto;padding:30px}

.card{
background:white;
padding:26px;
border-radius:14px;
margin-bottom:22px;
box-shadow:0 8px 24px rgba(0,0,0,.06)
}

textarea,input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #d4d8e2;
font-size:14px
}

button{
padding:14px;
border-radius:10px;
border:none;
font-weight:700;
background:linear-gradient(135deg,#667eea,#5a63d8);
color:white;
width:100%;
cursor:pointer;
margin-top:10px
}
button:hover{opacity:.95}

/* ATS meter */

.meter{
height:18px;
background:#e3e7f1;
border-radius:20px;
overflow:hidden;
margin-top:10px
}

.meter-fill{
height:100%;
background:linear-gradient(90deg,#ff5a5a,#ffcc00,#2ecc71);
width:0%
}

.score{
font-size:34px;
font-weight:800;
text-align:center;
color:#2f3a56
}

.chance{
text-align:center;
font-weight:700;
margin-top:6px
}

/* keyword chips */

.chips{margin-top:10px}
.chip{
display:inline-block;
padding:6px 12px;
margin:4px;
border-radius:18px;
font-size:13px;
font-weight:600
}

.found{background:#d4f6df;color:#0b7a39}
.missing{background:#ffe0e0;color:#b30000}

/* resume */

.resume{
font-family:Georgia,serif;
line-height:1.7;
white-space:pre-wrap;
}

.name{font-size:26px;font-weight:800;text-align:center}
.contact{text-align:center;color:#666;margin-bottom:10px}
.rule{border-top:1px solid #dcdfe7;margin:10px 0}
.lock{background:#fafafa;padding:20px;border-radius:10px;text-align:center;color:#666}

</style>
</head>

<body>

<div class="container">

<h2>⚡ ATSCheckPro</h2>

<div class="card">
<h3>Job Description</h3>
<textarea id="job" rows="7"></textarea>
</div>

<div class="card">
<h3>Resume</h3>
<textarea id="resume" rows="9"></textarea>
</div>

<div class="card">
<h3>License Key (optional)</h3>
<input id="key">
</div>

<button onclick="run()">Analyze Resume</button>

<div id="results" style="display:none">

<div class="card">

<div id="score" class="score"></div>

<div class="meter">
<div id="meterFill" class="meter-fill"></div>
</div>

<div id="chance" class="chance"></div>

</div>

<div class="card">
<h3>Keyword Match</h3>
<div id="chips" class="chips"></div>
</div>

<div class="card">
<h3>Optimized Resume</h3>
<div id="resumeOut" class="resume"></div>
<button onclick="downloadResume()">Download Optimized Resume PDF</button>
</div>

<div class="card">
<h3>Cover Letter</h3>
<div id="coverOut" class="resume"></div>
<button onclick="downloadCover()">Download Cover Letter PDF</button>
</div>

<div class="card">
<h3>Optimization Report</h3>
<button onclick="downloadReport()">Download Optimization Report PDF</button>
</div>

</div>

</div>

<script>

function renderResume(text){

if(!text) return "";

const lines=text.split("\n").filter(l=>l.trim());

if(lines.length<2) return text;

const name=lines[0];
const contact=lines[1];
const body=lines.slice(2).join("\n");

return `
<div class="name">${name}</div>
<div class="contact">${contact}</div>
<div class="rule"></div>
<div>${body.replace(/--------------------------------/g,'<div class="rule"></div>')}</div>
`;

}

function selectionChance(score){

if(score>=75) return ["High chance of shortlist","#2ecc71"];
if(score>=60) return ["Moderate chance","#ffcc00"];
return ["Low chance — improve resume","#ff5a5a"];

}

async function run(){

const job=document.getElementById("job").value.trim();
const resume=document.getElementById("resume").value.trim();
const key=document.getElementById("key").value.trim();

if(!job||!resume){
alert("Paste job + resume first");
return;
}

const res=await fetch("/api/optimize",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
jobDescription:job,
resumeText:resume,
licenseKey:key||""
})
});

const data=await res.json();
window.lastData=data;

document.getElementById("results").style.display="block";

/* score */

const score=data.scoreBefore||0;

document.getElementById("score").innerText=score+"/100";

document.getElementById("meterFill").style.width=score+"%";

/* chance */

const [label,color]=selectionChance(score);
const chanceEl=document.getElementById("chance");
chanceEl.innerText=label;
chanceEl.style.color=color;

/* keywords */

const chips=document.getElementById("chips");
chips.innerHTML="";

(data.keywordsFound||[]).forEach(k=>{
chips.innerHTML+=`<span class="chip found">✔ ${k}</span>`;
});

(data.keywordsMissingTop||[]).forEach(k=>{
chips.innerHTML+=`<span class="chip missing">✖ ${k}</span>`;
});

/* pro output */

if(data.isPro){

document.getElementById("resumeOut").innerHTML=
renderResume(data.optimizedText);

document.getElementById("coverOut").innerText=data.coverLetter||"";

}else{

document.getElementById("resumeOut").innerHTML=
"<div class='lock'>🔒 Unlock PRO to download resume</div>";

document.getElementById("coverOut").innerHTML=
"<div class='lock'>🔒 Unlock PRO to download cover letter</div>";

}

}

/* downloads */

async function download(type,body){

const res=await fetch("/api/download",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(body)
});

if(!res.ok){
alert("Download failed — ensure PRO key used");
return;
}

const blob=await res.blob();
const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download=type+".pdf";
a.click();

URL.revokeObjectURL(url);
}

function downloadResume(){
if(!window.lastData?.optimizedText)return alert("Run PRO first");
download("resume",{type:"resume",optimizedText:window.lastData.optimizedText,licenseKey:key.value.trim()});
}

function downloadCover(){
if(!window.lastData?.coverLetter)return alert("Run PRO first");
download("cover",{type:"cover",coverLetter:window.lastData.coverLetter,licenseKey:key.value.trim()});
}

function downloadReport(){
if(!window.lastData)return alert("Run analysis first");
download("report",{type:"report",report:{
score:window.lastData.scoreBefore,
impression:window.lastData.quickImpression,
keywords:window.lastData.keywordsMissingTop,
notes:window.lastData.recruiterNotes
},licenseKey:key.value.trim()});
}

</script>

</body>
</html>
