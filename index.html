<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ATSCheckPro</title>

<style>
body{font-family:system-ui;background:#eef2f7;margin:0}
.container{max-width:900px;margin:auto;padding:30px}
.card{background:white;padding:26px;border-radius:14px;margin-bottom:22px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
textarea,input{width:100%;padding:12px;border-radius:8px;border:1px solid #d4d8e2;font-size:14px}
button{padding:14px;border-radius:10px;border:none;font-weight:700;background:linear-gradient(135deg,#667eea,#5a63d8);color:white;width:100%;cursor:pointer;margin-top:10px}
button:hover{opacity:.95}

.resume{font-family:Georgia,serif;line-height:1.7;white-space:pre-wrap}
.name{font-size:26px;font-weight:800;text-align:center}
.contact{text-align:center;color:#666;margin-bottom:10px}
.rule{border-top:1px solid #dcdfe7;margin:10px 0}

.photo{
width:90px;height:90px;border-radius:50%;
object-fit:cover;margin:0 auto 10px auto;display:block;
border:2px solid #ddd;
}

.meter{height:18px;background:#e3e7f1;border-radius:20px;overflow:hidden;margin-top:10px}
.meter-fill{height:100%;background:linear-gradient(90deg,#ff5a5a,#ffcc00,#2ecc71);width:0%}

.chip{display:inline-block;padding:6px 12px;margin:4px;border-radius:18px;font-size:13px;font-weight:600}
.found{background:#d4f6df;color:#0b7a39}
.missing{background:#ffe0e0;color:#b30000}
</style>
</head>

<body>
<div class="container">

<h2>⚡ ATSCheckPro</h2>

<div class="card">
<h3>Job Description</h3>
<textarea id="job" rows="6"></textarea>
</div>

<div class="card">
<h3>Resume</h3>
<textarea id="resume" rows="8"></textarea>

<h4 style="margin-top:15px">Candidate Photo (optional)</h4>
<input type="file" id="photo" accept="image/*">
</div>

<div class="card">
<h3>License Key</h3>
<input id="key">
</div>

<button onclick="run()">Analyze Resume</button>

<div id="results" style="display:none">

<div class="card">
<div id="score" style="font-size:32px;font-weight:800;text-align:center"></div>
<div class="meter"><div id="meterFill" class="meter-fill"></div></div>
</div>

<div class="card">
<h3>Keyword Match</h3>
<div id="chips"></div>
</div>

<div class="card">
<h3>Optimized Resume</h3>
<div id="resumeOut" class="resume"></div>
<button onclick="downloadResume()">Download Resume PDF</button>
</div>

<div class="card">
<h3>Cover Letter</h3>
<div id="coverOut" class="resume"></div>
<button onclick="downloadCover()">Download Cover Letter PDF</button>
</div>

<div class="card">
<button onclick="downloadReport()">Download Optimization Report</button>
</div>

</div>
</div>

<script>

let photoBase64="";

document.getElementById("photo").addEventListener("change",e=>{
const file=e.target.files[0];
if(!file) return;

const reader=new FileReader();
reader.onload=()=>photoBase64=reader.result;
reader.readAsDataURL(file);
});

function renderResume(text){

if(!text) return "";

const lines=text.split("\n").filter(l=>l.trim());

let name=lines[0]||"";
let contact=lines[1]||"";
let body=lines.slice(2).join("\n");

return `
${photoBase64?`<img src="${photoBase64}" class="photo">`:""}
<div class="name">${name}</div>
<div class="contact">${contact}</div>
<div class="rule"></div>
<div>${body.replace(/--------------------------------/g,'<div class="rule"></div>')}</div>
`;
}

async function run(){

const job=jobEl.value.trim();
const resume=resumeEl.value.trim();
const key=keyEl.value.trim();

if(!job||!resume){alert("Paste job + resume");return;}

const res=await fetch("/api/optimize",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({jobDescription:job,resumeText:resume,licenseKey:key})
});

const data=await res.json();
window.lastData=data;

results.style.display="block";

score.innerText=data.scoreBefore+"/100";
meterFill.style.width=data.scoreBefore+"%";

chips.innerHTML="";
(data.keywordsFound||[]).forEach(k=>chips.innerHTML+=`<span class="chip found">${k}</span>`);
(data.keywordsMissingTop||[]).forEach(k=>chips.innerHTML+=`<span class="chip missing">${k}</span>`);

if(data.isPro){
resumeOut.innerHTML=renderResume(data.optimizedText);
coverOut.innerText=data.coverLetter||"";
}else{
resumeOut.innerHTML="🔒 Unlock PRO";
coverOut.innerHTML="🔒 Unlock PRO";
}
}

/* ---------- DOWNLOADS ---------- */

function candidateName(){
const t=window.lastData?.optimizedText||"";
return (t.split("\n")[0]||"resume").replace(/[^a-z0-9]/gi,"-");
}

async function download(type,body,name){

const res=await fetch("/api/download",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(body)
});

const blob=await res.blob();
const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download=name+".pdf";
a.click();

URL.revokeObjectURL(url);
}

function downloadResume(){
download("resume",
{type:"resume",optimizedText:lastData.optimizedText,photo:photoBase64,licenseKey:keyEl.value.trim()},
candidateName()+"-Resume");
}

function downloadCover(){
download("cover",
{type:"cover",coverLetter:lastData.coverLetter,licenseKey:keyEl.value.trim()},
candidateName()+"-CoverLetter");
}

function downloadReport(){
download("report",
{type:"report",
report:{
score:lastData.scoreBefore,
impression:lastData.quickImpression,
keywords:lastData.keywordsMissingTop,
notes:lastData.recruiterNotes
},
licenseKey:keyEl.value.trim()},
candidateName()+"-ATSReport");
}

/* shortcut refs */
const jobEl=document.getElementById("job");
const resumeEl=document.getElementById("resume");
const keyEl=document.getElementById("key");
const results=document.getElementById("results");
const score=document.getElementById("score");
const meterFill=document.getElementById("meterFill");
const chips=document.getElementById("chips");
const resumeOut=document.getElementById("resumeOut");
const coverOut=document.getElementById("coverOut");

</script>
</body>
</html>
